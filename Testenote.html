<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Mock - Árvore que Nasce na Sidebar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #0f0f0f; 
            color: #e0e0e0; 
            overflow: hidden; 
            margin: 0;
            height: 100vh;
            display: flex;
        }

        /* ========================================= */
        /* SIDEBAR (É A RAIZ DA ÁRVORE)              */
        /* ========================================= */
        #sidebar {
            width: 240px;
            height: 100vh;
            background-color: #0a0a0a;
            border-right: 1px solid #1a1a1a;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            z-index: 20;
            position: relative;
        }
        #sidebar.collapsed {
            width: 56px;
        }

        .sidebar-header {
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 14px;
            border-bottom: 1px solid #1a1a1a;
            flex-shrink: 0;
        }
        .sidebar-header h1 {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.15em;
            color: #666;
            white-space: nowrap;
            transition: opacity 0.2s;
        }
        #sidebar.collapsed .sidebar-header h1 { opacity: 0; }
        #sidebar.collapsed .sidebar-header { justify-content: center; }

        .sidebar-toggle {
            width: 28px; height: 28px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 6px;
            color: #666;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .sidebar-toggle:hover { background: #1a1a1a; color: #4ade80; }

        .category-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .category-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            color: #aaa;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.15s;
            white-space: nowrap;
            position: relative;
            border: 1.5px solid transparent;
        }
        .category-item:hover {
            background-color: #1a1a1a;
            color: #fff;
        }
        .category-item.active {
            background-color: #14532d;
            color: #a7f3d0;
            border-color: #4ade80;
            box-shadow: 0 0 12px rgba(74, 222, 128, 0.2);
        }
        .category-item .cat-icon {
            width: 20px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .category-item .cat-label {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: opacity 0.2s;
        }
        .category-item .cat-count {
            font-size: 10px;
            color: #555;
            background: #1a1a1a;
            padding: 1px 6px;
            border-radius: 8px;
            transition: opacity 0.2s;
        }
        #sidebar.collapsed .cat-label,
        #sidebar.collapsed .cat-count { opacity: 0; pointer-events: none; }
        #sidebar.collapsed .category-item { justify-content: center; padding: 10px; }

        .new-category-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            color: #4ade80;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.15s;
            border: 1px dashed #2a4a3a;
            margin-top: 8px;
            white-space: nowrap;
            justify-content: center;
        }
        .new-category-btn:hover { background: rgba(74, 222, 128, 0.05); }
        #sidebar.collapsed .new-category-btn .new-label { display: none; }

        /* ========================================= */
        /* CANVAS CENTRAL: ÁRVORE                    */
        /* ========================================= */
        #tree-panel {
            flex: 1;
            height: 100vh;
            position: relative;
            overflow: hidden;
            background-color: #0f0f0f;
            background-image: radial-gradient(#1a1a1a 1px, transparent 1px);
            background-size: 24px 24px;
        }

        #node-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            transform-origin: 0 0;
        }

        .mind-node {
            position: absolute;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 14px;
            background-color: #1a1a1a;
            border: 1.5px solid #2a2a2a;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 500;
            color: #d0d0d0;
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
            transition: all 0.15s ease;
            z-index: 10;
        }
        .mind-node:hover {
            border-color: #4ade80;
            background-color: #1f1f1f;
        }
        .mind-node.leaf {
            border-style: dashed;
            border-color: #333;
            color: #999;
        }
        .mind-node.current-note {
            background-color: #14532d;
            border-color: #4ade80;
            color: #fff;
            box-shadow: 0 0 15px rgba(74, 222, 128, 0.3);
        }

        .expand-btn {
            width: 16px; height: 16px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 4px;
            background: #2a2a2a;
            color: #888;
            font-size: 9px;
            font-weight: 700;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .expand-btn:hover { background: #4ade80; color: #000; }
        .expand-btn.expanded { transform: rotate(90deg); background: #4ade80; color: #000; }
        .expand-btn.placeholder { visibility: hidden; }

        .note-indicator {
            width: 6px; height: 6px;
            border-radius: 50%;
            background-color: #4ade80;
            flex-shrink: 0;
        }

        #connections-svg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 5;
            overflow: visible;
        }
        .tree-line {
            fill: none;
            stroke: #4ade80;
            stroke-width: 1.5;
            opacity: 0.5;
            transition: opacity 0.3s, stroke-width 0.3s;
        }
        .tree-line.highlighted { opacity: 1; stroke-width: 2.5; }

        /* Controles flutuantes */
        .tree-controls {
            position: absolute;
            top: 16px; right: 16px;
            display: flex;
            gap: 8px;
            z-index: 100;
        }
        .ctrl-btn {
            background: rgba(20, 20, 20, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid #2a2a2a;
            color: #aaa;
            padding: 7px 11px;
            border-radius: 8px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .ctrl-btn:hover { border-color: #4ade80; color: #fff; }

        .zoom-controls {
            position: absolute;
            bottom: 16px; left: 16px;
            display: flex;
            gap: 4px;
            z-index: 100;
        }
        .zoom-btn {
            width: 32px; height: 32px;
            background: rgba(20, 20, 20, 0.9);
            border: 1px solid #2a2a2a;
            color: #aaa;
            border-radius: 6px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
        }
        .zoom-btn:hover { border-color: #4ade80; color: #fff; }

        /* ========================================= */
        /* EDITOR DE NOTAS                            */
        /* ========================================= */
        #editor-panel {
            width: 420px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #121212;
            overflow: hidden;
            flex-shrink: 0;
            border-left: 1px solid #1a1a1a;
            transition: width 0.3s ease;
        }
        #editor-panel.collapsed { width: 0; border-left: none; }

        .editor-header {
            height: 56px;
            border-bottom: 1px solid #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            flex-shrink: 0;
        }

        .editor-body {
            flex: 1;
            overflow-y: auto;
            padding: 32px 36px;
        }

        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 10px;
            color: #666;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .breadcrumb-item { cursor: pointer; transition: color 0.2s; }
        .breadcrumb-item:hover { color: #4ade80; }

        .note-title {
            font-size: 24px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 20px;
            outline: none;
        }

        .note-content {
            color: #c0c0c0;
            font-size: 14px;
            line-height: 1.7;
            outline: none;
        }
        .note-content p { margin-bottom: 14px; }
        .note-content strong { color: #fff; }
        .note-content ul { list-style: disc; padding-left: 22px; margin-bottom: 14px; }
        .note-content li { margin-bottom: 5px; }
        .note-content a {
            color: #4ade80;
            text-decoration: none;
            border-bottom: 1px dashed #4ade80;
            cursor: pointer;
        }
        .note-content a:hover { background-color: rgba(74, 222, 128, 0.1); }

        .note-meta {
            display: flex;
            gap: 6px;
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid #1a1a1a;
            flex-wrap: wrap;
        }
        .meta-tag {
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 4px;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            color: #888;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #444;
            gap: 16px;
            text-align: center;
        }

        .toast {
            position: fixed;
            bottom: 24px; right: 24px;
            background: #1a1a1a;
            border: 1px solid #4ade80;
            color: #4ade80;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 12px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s;
            pointer-events: none;
            z-index: 2000;
        }
        .toast.show { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body>

    <!-- SIDEBAR (Raiz da Árvore) -->
    <aside id="sidebar">
        <div class="sidebar-header">
            <h1>MENTE</h1>
            <div class="sidebar-toggle" onclick="toggleSidebar()">
                <i data-lucide="menu" class="w-4 h-4"></i>
            </div>
        </div>
        <div class="category-list" id="category-list"></div>
    </aside>

    <!-- CANVAS DA ÁRVORE -->
    <div id="tree-panel">
        <div class="tree-controls">
            <button class="ctrl-btn" onclick="resetView()">
                <i data-lucide="target" class="w-3.5 h-3.5"></i> Centralizar
            </button>
            <button class="ctrl-btn" onclick="expandAll()">
                <i data-lucide="maximize-2" class="w-3.5 h-3.5"></i> Expandir Tudo
            </button>
            <button class="ctrl-btn" onclick="collapseAll()">
                <i data-lucide="minimize-2" class="w-3.5 h-3.5"></i> Recolher Tudo
            </button>
        </div>

        <div class="zoom-controls">
            <button class="zoom-btn" onclick="zoom(0.1)"><i data-lucide="plus" class="w-4 h-4"></i></button>
            <button class="zoom-btn" onclick="zoom(-0.1)"><i data-lucide="minus" class="w-4 h-4"></i></button>
        </div>

        <div id="node-container">
            <svg id="connections-svg"></svg>
        </div>
    </div>

    <!-- EDITOR DE NOTAS -->
    <div id="editor-panel">
        <div class="editor-header">
            <div class="flex items-center gap-2">
                <i data-lucide="file-text" class="w-4 h-4 text-[#4ade80]"></i>
                <span class="text-xs text-gray-500" id="editor-status">Nenhuma nota aberta</span>
            </div>
            <div class="flex gap-1">
                <button class="text-gray-400 hover:text-white p-2 rounded hover:bg-[#1a1a1a] transition" title="Salvar">
                    <i data-lucide="save" class="w-4 h-4"></i>
                </button>
                <button class="text-gray-400 hover:text-white p-2 rounded hover:bg-[#1a1a1a] transition" onclick="toggleEditor()" title="Fechar editor">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>
        </div>

        <div class="editor-body">
            <div class="empty-state" id="empty-state">
                <i data-lucide="mouse-pointer-click" class="w-10 h-10 opacity-30"></i>
                <div>
                    <p class="text-sm mb-1">Clique em um nó da árvore</p>
                    <p class="text-xs opacity-60">para abrir a nota</p>
                </div>
            </div>

            <div id="note-view" class="hidden">
                <div class="breadcrumb" id="breadcrumb"></div>
                <h1 class="note-title" id="note-title" contenteditable="true"></h1>
                <div class="note-content" id="note-content" contenteditable="true"></div>
                <div class="note-meta" id="note-meta"></div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        lucide.createIcons();

        // ==========================================
        // DADOS
        // ==========================================
        const categories = [
            {
                id: 'comida', label: 'Comida', icon: 'utensils', noteCount: 5,
                children: [
                    {
                        id: 'doce', label: 'Doce', icon: 'cake', expanded: false,
                        note: { title: 'Doce', content: '<p>Sobremesas. Destaque para o <a onclick="openNote(\'brigadeiro\')">[[Brigadeiro]]</a>.</p>', tags: ['#sobremesa'] },
                        children: [
                            {
                                id: 'brigadeiro', label: 'Brigadeiro', icon: 'candy', expanded: false,
                                note: { title: 'Brigadeiro', content: '<p>Clássico. Veja o <a onclick="openNote(\'brigadeiro-micro\')">[[Brigadeiro de Microondas]]</a>.</p>', tags: ['#receita'] },
                                children: [
                                    { id: 'brigadeiro-micro', label: 'Brigadeiro de Microondas', icon: 'zap', expanded: false,
                                      note: { title: 'Brigadeiro de Microondas', content: '<p>3 min no micro-ondas.</p>', tags: ['#rápido'] }, children: [] }
                                ]
                            }
                        ]
                    },
                    {
                        id: 'salgada', label: 'Salgada', icon: 'pizza', expanded: false,
                        note: { title: 'Salgada', content: '<p>Salgados em geral. Veja o <a onclick="openNote(\'pao\')">[[Pão]]</a>.</p>', tags: ['#salgado'] },
                        children: [
                            {
                                id: 'pao', label: 'Pão', icon: 'wheat', expanded: false,
                                note: { title: 'Pão', content: '<p>Veja o <a onclick="openNote(\'pao-queijo\')">[[Pão de Queijo]]</a>.</p>', tags: ['#padaria'] },
                                children: [
                                    { id: 'pao-queijo', label: 'Pão de Queijo', icon: 'circle', expanded: false,
                                      note: { title: 'Pão de Queijo', content: '<p>Minas Gerais.</p>', tags: ['#mineiro'] }, children: [] }
                                ]
                            }
                        ]
                    }
                ]
            },
            {
                id: 'bebidas', label: 'Bebidas', icon: 'cup-soda', noteCount: 5,
                children: [
                    {
                        id: 'quente', label: 'Quente', icon: 'flame', expanded: false,
                        note: { title: 'Quente', content: '<p>Veja o <a onclick="openNote(\'cafe\')">[[Café]]</a>.</p>', tags: ['#quente'] },
                        children: [
                            {
                                id: 'cafe', label: 'Café', icon: 'coffee', expanded: false,
                                note: { title: 'Café', content: '<p>Veja o <a onclick="openNote(\'cappuccino\')">[[Cappuccino]]</a>.</p>', tags: ['#cafeina'] },
                                children: [
                                    { id: 'cappuccino', label: 'Cappuccino', icon: 'cup-soda', expanded: false,
                                      note: { title: 'Cappuccino', content: '<p>Italiano.</p>', tags: ['#italiano'] }, children: [] }
                                ]
                            }
                        ]
                    },
                    {
                        id: 'gelada', label: 'Gelada', icon: 'snowflake', expanded: false,
                        note: { title: 'Gelada', content: '<p>Veja o <a onclick="openNote(\'suco\')">[[Suco]]</a>.</p>', tags: ['#gelado'] },
                        children: [
                            {
                                id: 'suco', label: 'Suco', icon: 'glass-water', expanded: false,
                                note: { title: 'Suco', content: '<p>Veja o <a onclick="openNote(\'suco-laranja\')">[[Suco de Laranja]]</a>.</p>', tags: ['#natural'] },
                                children: [
                                    { id: 'suco-laranja', label: 'Suco de Laranja', icon: 'citrus', expanded: false,
                                      note: { title: 'Suco de Laranja', content: '<p>Vitamina C.</p>', tags: ['#vitamina'] }, children: [] }
                                ]
                            }
                        ]
                    }
                ]
            },
            {
                id: 'livros', label: 'Livros', icon: 'book-open', noteCount: 1,
                children: [
                    {
                        id: 'ficcao', label: 'Ficção', icon: 'sparkles', expanded: false,
                        note: { title: 'Ficção', content: '<p>Ficção científica.</p>', tags: ['#ficcao'] },
                        children: [
                            { id: 'duna', label: 'Duna', icon: 'book', expanded: false,
                              note: { title: 'Duna', content: '<p>Frank Herbert.</p>', tags: ['#scifi'] }, children: [] }
                        ]
                    }
                ]
            }
        ];

        // ==========================================
        // ESTADO
        // ==========================================
        const LEVEL_SPACING = 240;
        const VERTICAL_SPACING = 55;
        const ROOT_X = 20; // Onde os filhos diretos começam (dentro do canvas, perto da sidebar)

        let nodePositions = {};
        let currentNodeId = null;
        let currentCategoryId = 'bebidas';
        let scale = 1;
        let translateX = 0, translateY = 0;
        let nodesIndex = {};
        let currentCategory = null;

        // ==========================================
        // RENDERIZAÇÃO DA SIDEBAR
        // ==========================================
        function renderCategoryList() {
            const list = document.getElementById('category-list');
            list.innerHTML = '';

            categories.forEach(cat => {
                const item = document.createElement('div');
                item.className = `category-item ${cat.id === currentCategoryId ? 'active' : ''}`;
                item.setAttribute('data-label', cat.label);
                item.onclick = () => switchCategory(cat.id);
                item.innerHTML = `
                    <div class="cat-icon"><i data-lucide="${cat.icon}" class="w-4 h-4"></i></div>
                    <div class="cat-label">${cat.label}</div>
                    <div class="cat-count">${cat.noteCount}</div>
                `;
                list.appendChild(item);
            });

            const newBtn = document.createElement('div');
            newBtn.className = 'new-category-btn';
            newBtn.onclick = () => showToast('Em breve: criar nova categoria');
            newBtn.innerHTML = `
                <i data-lucide="plus" class="w-4 h-4"></i>
                <span class="new-label">Nova Categoria</span>
            `;
            list.appendChild(newBtn);
            lucide.createIcons();
        }

        // ==========================================
        // TROCA DE CATEGORIA (A CATEGORIA VIRA A RAIZ)
        // ==========================================
        function switchCategory(catId) {
            const cat = categories.find(c => c.id === catId);
            if (!cat) return;

            currentCategoryId = catId;
            currentCategory = cat;
            currentNodeId = null;

            // A categoria em si é o nó raiz virtual (não aparece no canvas).
            // Seus FILHOS aparecem na coluna 0.
            nodesIndex = {};
            // Indexa a própria categoria também (para poder abrir a nota dela)
            nodesIndex[cat.id] = {
                id: cat.id,
                label: cat.label,
                icon: cat.icon,
                note: cat.note || { title: cat.label, content: '<p>' + cat.label + '</p>', tags: [] },
                children: cat.children
            };
            cat.children.forEach(indexNodes);

            renderCategoryList();
            renderTree();

            document.getElementById('empty-state').classList.remove('hidden');
            document.getElementById('note-view').classList.add('hidden');
            document.getElementById('editor-status').innerText = 'Nenhuma nota aberta';

            setTimeout(() => resetView(), 50);
        }

        function indexNodes(node) {
            nodesIndex[node.id] = node;
            if (node.children) node.children.forEach(indexNodes);
        }

        function findPath(targetId, current, path = []) {
            if (!current) return null;
            const newPath = [...path, current];
            if (current.id === targetId) return newPath;
            if (current.children) {
                for (const child of current.children) {
                    const result = findPath(targetId, child, newPath);
                    if (result) return result;
                }
            }
            return null;
        }

        // ==========================================
        // RENDERIZAÇÃO DA ÁRVORE
        // ==========================================
        function renderTree() {
            const container = document.getElementById('node-container');
            container.querySelectorAll('.mind-node').forEach(n => n.remove());
            nodePositions = {};

            if (!currentCategory) return;

            // A "raiz" da árvore visual são os FILHOS da categoria.
            // A categoria em si fica na sidebar (não é desenhada).
            const visibleRoots = currentCategory.children;
            
            // Layout em "colunas" (vertical layout estilo workflowy):
            // Cada coluna é um nível (depth). Vamos empilhar os nós verticalmente.
            const roots = visibleRoots;
            
            // Calcula posições recursivamente
            let globalY = 0;
            roots.forEach(root => {
                const height = calculatePositions(root, 0, ROOT_X, globalY);
                globalY += height + VERTICAL_SPACING;
            });
            
            // Desenha os filhos
            roots.forEach(root => createNodes(root));
            
            // Desenha as linhas que SAEM da sidebar (borda direita) em direção aos primeiros filhos
            drawSidebarConnections(roots);
            drawTreeLines(roots);
        }

        function calculatePositions(node, depth, x, yStart) {
            const visibleChildren = node.expanded ? node.children : [];
            let y;

            if (visibleChildren.length === 0) {
                y = yStart;
            } else {
                let currentY = yStart;
                visibleChildren.forEach(child => {
                    const childHeight = calculatePositions(child, depth + 1, x + LEVEL_SPACING, currentY);
                    currentY += childHeight + VERTICAL_SPACING;
                });
                const firstChildY = nodePositions[visibleChildren[0].id].y;
                const lastChildY = nodePositions[visibleChildren[visibleChildren.length - 1].id].y;
                y = (firstChildY + lastChildY) / 2;
            }

            nodePositions[node.id] = { x, y, depth };
            if (visibleChildren.length === 0) return 0;
            return (visibleChildren.length - 1) * VERTICAL_SPACING;
        }

        function createNodes(node) {
            const container = document.getElementById('node-container');
            const pos = nodePositions[node.id];
            if (!pos) return;

            const el = document.createElement('div');
            el.className = `mind-node ${node.children && node.children.length > 0 ? '' : 'leaf'}`;
            el.id = `node-${node.id}`;
            el.style.left = `${pos.x}px`;
            el.style.top = `${pos.y}px`;
            el.style.transform = 'translateY(-50%)';

            if (currentNodeId === node.id) el.classList.add('current-note');

            let html = '';
            if (node.children && node.children.length > 0) {
                html += `<div class="expand-btn ${node.expanded ? 'expanded' : ''}">▶</div>`;
            } else {
                html += `<div class="expand-btn placeholder">▶</div>`;
            }
            html += `<i data-lucide="${node.icon || 'circle'}" class="w-3.5 h-3.5"></i>`;
            if (node.note) html += `<div class="note-indicator"></div>`;
            html += `<span>${node.label}</span>`;

            el.innerHTML = html;

            const expandBtn = el.querySelector('.expand-btn');
            if (expandBtn && !expandBtn.classList.contains('placeholder')) {
                expandBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    node.expanded = !node.expanded;
                    renderTree();
                });
            }

            el.addEventListener('click', (e) => {
                if (e.target.classList.contains('expand-btn')) return;
                e.stopPropagation();
                openNote(node.id);
            });

            container.appendChild(el);

            if (node.expanded && node.children.length > 0) {
                node.children.forEach(child => createNodes(child));
            }
        }

        // ==========================================
        // LINHAS QUE SAEM DA SIDEBAR (O DIFERENCIAL!)
        // ==========================================
        function drawSidebarConnections(roots) {
            const svg = document.getElementById('connections-svg');
            const sidebarEl = document.getElementById('sidebar');
            const panelEl = document.getElementById('tree-panel');
            
            // Posição X/Y da borda direita do item de categoria ativo na sidebar
            const activeItem = sidebarEl.querySelector('.category-item.active');
            if (!activeItem) return;
            
            const sidebarRect = sidebarEl.getBoundingClientRect();
            const panelRect = panelEl.getBoundingClientRect();
            const itemRect = activeItem.getBoundingClientRect();
            
            // Ponto de origem: borda direita da sidebar, alinhado ao centro do item ativo
            // Coordenadas relativas ao node-container (que tem o translate/scale aplicado)
            const originX = (sidebarRect.right - panelRect.left - translateX) / scale;
            const originY = (itemRect.top + itemRect.height / 2 - panelRect.top - translateY) / scale;

            roots.forEach(root => {
                const pos = nodePositions[root.id];
                if (!pos) return;

                const targetEl = document.getElementById(`node-${root.id}`);
                if (!targetEl) return;
                
                // Ponto de chegada: lado esquerdo do primeiro filho
                const x1 = originX;
                const y1 = originY;
                const x2 = pos.x;
                const y2 = pos.y;

                const controlOffset = (x2 - x1) * 0.5;
                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                const d = `M ${x1} ${y1} C ${x1 + controlOffset} ${y1}, ${x2 - controlOffset} ${y2}, ${x2} ${y2}`;
                
                path.setAttribute('d', d);
                path.setAttribute('class', 'tree-line' + (currentNodeId === root.id || currentNodeId === currentCategoryId ? ' highlighted' : ''));
                svg.appendChild(path);
            });
        }

        function drawTreeLines(roots) {
            const svg = document.getElementById('connections-svg');
            // Não limpamos o SVG inteiro — apenas adicionamos as linhas internas.
            // (As linhas da sidebar já foram adicionadas em drawSidebarConnections.)

            function drawRecursive(currentNode) {
                if (!currentNode.expanded || !currentNode.children) return;
                const parentPos = nodePositions[currentNode.id];
                const parentEl = document.getElementById(`node-${currentNode.id}`);
                if (!parentEl || !parentPos) return;

                const parentWidth = parentEl.offsetWidth;

                currentNode.children.forEach(child => {
                    const childPos = nodePositions[child.id];
                    if (!childPos) return;

                    const x1 = parentPos.x + parentWidth;
                    const y1 = parentPos.y;
                    const x2 = childPos.x;
                    const y2 = childPos.y;

                    const controlOffset = (x2 - x1) * 0.5;
                    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    const d = `M ${x1} ${y1} C ${x1 + controlOffset} ${y1}, ${x2 - controlOffset} ${y2}, ${x2} ${y2}`;

                    path.setAttribute('d', d);
                    const isHighlighted = currentNodeId === child.id || currentNodeId === currentNode.id;
                    path.setAttribute('class', 'tree-line' + (isHighlighted ? ' highlighted' : ''));
                    svg.appendChild(path);

                    drawRecursive(child);
                });
            }

            roots.forEach(root => drawRecursive(root));
        }

        // ==========================================
        // ABRIR NOTA
        // ==========================================
        function openNote(nodeId) {
            const node = nodesIndex[nodeId];
            if (!node || !node.note) {
                showToast('Esta nota ainda não tem conteúdo.');
                return;
            }

            currentNodeId = nodeId;

            document.getElementById('empty-state').classList.add('hidden');
            document.getElementById('note-view').classList.remove('hidden');
            document.getElementById('editor-status').innerText = `Editando: ${node.label}`;

            // Breadcrumb: sempre começa com a categoria raiz
            const breadcrumb = document.getElementById('breadcrumb');
            const items = [{ id: currentCategory.id, label: currentCategory.label }, ...(findPath(nodeId, currentCategory) || []).slice(1)];
            breadcrumb.innerHTML = items.map((n, i) => {
                const isLast = i === items.length - 1;
                const item = `<span class="breadcrumb-item" onclick="openNote('${n.id}')" style="${isLast ? 'color:#4ade80' : ''}">${n.label}</span>`;
                return item + (isLast ? '' : '<span style="opacity:0.3">›</span>');
            }).join('');

            document.getElementById('note-title').innerText = node.note.title;
            document.getElementById('note-content').innerHTML = node.note.content;

            const meta = document.getElementById('note-meta');
            meta.innerHTML = (node.note.tags || []).map(tag =>
                `<span class="meta-tag">${tag}</span>`
            ).join('');

            renderTree();
            scrollToNode(nodeId);
        }

        function scrollToNode(nodeId) {
            const pos = nodePositions[nodeId];
            if (!pos) return;
            const panel = document.getElementById('tree-panel');
            const targetX = -pos.x * scale + 200;
            const targetY = -pos.y * scale + (panel.offsetHeight / 2);
            animatePan(targetX, targetY);
        }

        let panAnimationFrame = null;
        function animatePan(targetX, targetY) {
            if (panAnimationFrame) cancelAnimationFrame(panAnimationFrame);
            const startX = translateX, startY = translateY;
            const startTime = performance.now();
            const duration = 400;

            function step(now) {
                const progress = Math.min((now - startTime) / duration, 1);
                const eased = 1 - Math.pow(1 - progress, 3);
                translateX = startX + (targetX - startX) * eased;
                translateY = startY + (targetY - startY) * eased;
                updateTransform();
                if (progress < 1) panAnimationFrame = requestAnimationFrame(step);
            }
            panAnimationFrame = requestAnimationFrame(step);
        }

        // ==========================================
        // PAN / ZOOM
        // ==========================================
        const canvas = document.getElementById('tree-panel');
        const nodeContainer = document.getElementById('node-container');

        function updateTransform() {
            nodeContainer.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
            // Redesenha as linhas da sidebar com a nova posição
            if (currentCategory) {
                const svg = document.getElementById('connections-svg');
                svg.innerHTML = '';
                drawSidebarConnections(currentCategory.children);
                drawTreeLines(currentCategory.children);
            }
        }

        let isPanning = false;
        let panStartX, panStartY, panStartTranslateX, panStartTranslateY;

        canvas.addEventListener('mousedown', (e) => {
            if (e.target.closest('.mind-node')) return;
            if (e.target.closest('.tree-controls') || e.target.closest('.zoom-controls')) return;
            isPanning = true;
            panStartX = e.clientX;
            panStartY = e.clientY;
            panStartTranslateX = translateX;
            panStartTranslateY = translateY;
        });

        document.addEventListener('mousemove', (e) => {
            if (!isPanning) return;
            translateX = panStartTranslateX + (e.clientX - panStartX);
            translateY = panStartTranslateY + (e.clientY - panStartY);
            updateTransform();
        });

        document.addEventListener('mouseup', () => { isPanning = false; });

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            zoom(e.deltaY > 0 ? -0.1 : 0.1);
        }, { passive: false });

        function zoom(delta) {
            const newScale = Math.max(0.3, Math.min(2, scale + delta));
            const rect = canvas.getBoundingClientRect();
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            translateX = centerX - (centerX - translateX) * (newScale / scale);
            translateY = centerY - (centerY - translateY) * (newScale / scale);
            scale = newScale;
            updateTransform();
        }

        function resetView() {
            scale = 1;
            translateX = 0;
            const panel = document.getElementById('tree-panel');
            // Encontra o Y médio dos filhos para centralizar
            const roots = currentCategory ? currentCategory.children : [];
            if (roots.length > 0) {
                const ys = roots.map(r => nodePositions[r.id]?.y).filter(y => y !== undefined);
                if (ys.length > 0) {
                    const avgY = ys.reduce((a, b) => a + b, 0) / ys.length;
                    translateY = panel.offsetHeight / 2 - avgY;
                } else {
                    translateY = panel.offsetHeight / 2;
                }
            } else {
                translateY = panel.offsetHeight / 2;
            }
            updateTransform();
        }

        function expandAll() {
            function rec(node) { node.expanded = true; if (node.children) node.children.forEach(rec); }
            if (currentCategory) currentCategory.children.forEach(rec);
            renderTree();
            setTimeout(() => resetView(), 50);
        }

        function collapseAll() {
            function rec(node) { node.expanded = false; if (node.children) node.children.forEach(rec); }
            if (currentCategory) currentCategory.children.forEach(rec);
            renderTree();
            setTimeout(() => resetView(), 50);
        }

        // ==========================================
        // TOGGLE
        // ==========================================
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('collapsed');
            setTimeout(() => {
                if (currentCategory) {
                    renderTree();
                    updateTransform();
                }
            }, 350);
        }

        function toggleEditor() {
            document.getElementById('editor-panel').classList.toggle('collapsed');
            setTimeout(() => { if (currentCategory) { renderTree(); updateTransform(); } }, 350);
        }

        // ==========================================
        // TOAST
        // ==========================================
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        // ==========================================
        // INICIALIZAÇÃO
        // ==========================================
        renderCategoryList();
        switchCategory('bebidas');

        window.addEventListener('resize', () => { if (currentCategory) { renderTree(); resetView(); } });
    </script>
</body>
</html>
